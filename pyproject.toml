[project]
name = "ai-agentic-analysis"
version = "0.1.0"
description = "Harness for measuring how well an agentic coding assistant performs HEP physics analysis tasks, with results tracked in MLflow"
requires-python = ">=3.13"
dependencies = [
    "mlflow>=3.16.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
run-trial = "agent_harness.cli:main"
grade-trial = "agent_harness.grader:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agent_harness"
