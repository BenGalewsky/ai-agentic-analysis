# Secrets the mlflow-stack chart expects to exist in the release namespace.
# The chart deliberately creates none of them.
#
# Placeholders only: replace every CHANGE-ME and encrypt with SOPS (or source
# from an external secret store) before committing to the Flux repo.
#
# The database password is embedded in connection URIs, so keep it URL-safe
# (letters and digits) or percent-encode it inside `uri` and `database_uri`.
#
# The admin's ObjectBucketClaim supplies the Secret and ConfigMap named
# `mlflow` with the bucket credentials; they are not listed here.
---
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-db
type: Opaque
stringData:
  # Postgres superuser password.
  POSTGRES_PASSWORD: CHANGE-ME-superuser-password
  # Database and owning user created on first start.
  POSTGRES_DB: mlflow
  USERDB_USER: mlflow
  USERDB_PASSWORD: CHANGE-ME-mlflow-password
  # MLflow backend store URI; must agree with the three values above.
  uri: postgresql://mlflow:CHANGE-ME-mlflow-password@mlflow-postgres:5432/mlflow
---
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-auth-secret
type: Opaque
stringData:
  # Flask session signing key, e.g. `openssl rand -hex 32`.
  secret-key: CHANGE-ME-flask-secret-key
---
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-auth-config
type: Opaque
stringData:
  basic_auth.ini: |
    [mlflow]
    default_permission = READ
    # Same database as the backend store; see values.yaml for why that's safe.
    database_uri = postgresql://mlflow:CHANGE-ME-mlflow-password@mlflow-postgres:5432/mlflow
    admin_username = admin
    # MLflow rejects admin passwords shorter than 12 characters.
    admin_password = CHANGE-ME-admin-password
